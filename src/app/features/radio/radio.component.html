<div class="radio">
  <div class="radio__hero">
    <app-station-header />
    <app-pahari-cap [selectedId]="districtId()" (districtSelect)="onDistrictSelect($event)" />
  </div>

  @if (status() === 'loading' || status() === 'error' || status() === 'awaiting-gesture') {
    <div class="radio__status">
      <app-radio-status
        [status]="status()"
        [message]="errorMessage()"
        (retry)="onRetry()"
      />
    </div>
  }

  <div id="radio-controls" class="radio__player">
    <app-now-playing
      [song]="currentSong()"
      [playerState]="playerState()"
      [districtName]="districtName()"
      [isPlaying]="isPlaying()"
      [disabled]="!controlsEnabled()"
      [currentTime]="currentTime()"
      [duration]="duration()"
      [progressPercent]="progressPercent()"
      (playPause)="onPlayPause()"
      (next)="onNext()"
      (previous)="onPrevious()"
      (seekFraction)="onSeek($event)"
    />
  </div>

  <app-site-credit />

  <div class="yt-engine" aria-hidden="true">
    <div #playerMount class="yt-mount"></div>
  </div>
</div>
